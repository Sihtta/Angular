<div class="episode-card">
<div class="movie-card">
  <h2 class="title">{{ episode.titre }}</h2>

  <img class="poster" [src]="episode.affiche" [alt]="episode.titre" />

  <a class="details-btn" [routerLink]="['/episodes', episode.id]">Détails</a>
</div>
  <button
    type="button"
    class="btn-delete"
    [appConfirmClick]="'Supprimer l’épisode : ' + episode.titre + ' ?'"
    (confirmed)="onDeleteConfirmed()">
    Supprimer
  </button>
</div>
